<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шпаргалка по отработке возражений</title>
<style>
:root{--yellow:#ffcc00;--yellow2:#fff3b0;--black:#111;--text:#242424;--muted:#707070;--bg:#f5f5f5;--card:#fff;--border:#e8e8e8;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 95% 0,rgba(255,204,0,.2),transparent 26%),var(--bg);color:var(--text)}
header{background:white;border-bottom:1px solid var(--border);padding:22px 24px;position:sticky;top:0;z-index:10}
.header{max-width:1220px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:15px;background:var(--yellow);display:grid;place-items:center;font-size:23px;font-weight:800}
h1{margin:0;font-size:27px;letter-spacing:-.4px;color:var(--black)} .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:1220px;margin:auto;padding:24px;display:grid;grid-template-columns:355px 1fr;gap:22px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.045)}
.search{position:relative;margin-bottom:12px} .search:before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:21px;color:#777}
input{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--border);border-radius:16px;background:#fafafa;font-size:15px;outline:none}
input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,204,0,.18);background:white}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.filter{width:auto;margin:0;padding:7px 10px;border-radius:999px;background:#f5f5f5;font-size:12px;border:1px solid var(--border)}
.filter.on{background:var(--yellow);border-color:var(--yellow)}
#list{display:grid;gap:9px;max-height:690px;overflow:auto;padding-right:4px}
.objection{width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--border);background:white;cursor:pointer;font-size:15px;line-height:1.35}
.objection:hover{background:#fffdf4;transform:translateY(-1px)} .objection.active{background:var(--yellow2);border-color:var(--yellow);font-weight:700;box-shadow:inset 4px 0 var(--yellow)}
.empty{min-height:560px;display:grid;place-items:center;text-align:center;color:var(--muted)} .empty-icon{width:68px;height:68px;border-radius:22px;background:var(--yellow);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
h2{font-size:30px;line-height:1.15;margin:0 0 12px;color:var(--black);letter-spacing:-.4px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px} .tag{background:#f1f1f1;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.quotes{background:#fafafa;border:1px solid var(--border);border-radius:20px;padding:17px;margin-bottom:16px}
.quotes h3,.answer h3,.section h3{margin:0 0 10px;font-size:16px;color:var(--black)} blockquote{margin:8px 0;padding-left:13px;border-left:3px solid var(--yellow);line-height:1.5;font-style:italic}
.answer{background:linear-gradient(180deg,#fff9d9,#fff2a8);border:1px solid #f0d65a;border-radius:20px;padding:18px;margin-bottom:14px}
.answer p,.section p{margin:0;line-height:1.58}
.copy{width:auto;margin-top:14px;padding:11px 15px;border:0;border-radius:14px;background:var(--black);color:white;font-weight:700;cursor:pointer}
.copy.done{background:#269344}
.section{border:1px solid var(--border);border-radius:18px;padding:16px 17px;margin-top:11px;background:white}
.section.objection-name{background:#f7f7f7}.warning{background:#fff7f4;border-color:#ffd8cb}
@media(max-width:820px){header{position:static}main{grid-template-columns:1fr;padding:15px}#list{max-height:none}h1{font-size:22px}h2{font-size:25px}}
</style>
</head>
<body>
<header><div class="header"><div class="logo">Я</div><div><h1>Шпаргалка по отработке возражений</h1><p class="sub">Реальные формулировки клиентов и готовые варианты ответа</p></div></div></header>
<main>
<aside class="panel">
<div class="search"><input id="search" placeholder="Поиск по возражениям и словам клиента"></div>
<div id="list"></div>
</aside>
<section class="panel"><div id="content" class="empty"><div><div class="empty-icon">💬</div><b>Выберите возражение</b><p>Справа появится готовая отработка.</p></div></div></section>
</main>
<script>
const data=[{"title": "«Это что-то нам будет стоить?»", "tags": ["Комиссия", "Стоимость"], "quotes": ["«Да, это что-то нам будет стоить?»", "«Это двадцать процентов, да, Премиум?»", "«Какой получается итоговый процент у нас комиссионных?»"], "answer": "Да, условия предусматривают дополнительную комиссию по бронированиям, которые проходят в рамках программы. Поэтому предлагаю оценивать не только размер комиссии, а итоговый финансовый результат: сколько дополнительных бронирований и дохода программа может принести вашему объекту.", "question": "Подскажите, для вас сейчас главный вопрос — сам размер комиссии или сомнение, что дополнительный результат её окупит?", "argument": "Переведите разговор с процента комиссии на чистый доход объекта. Уточните средний чек, свободные даты и необходимое количество дополнительных бронирований.", "next": "Предложить вместе оценить экономику программы на конкретном периоде.", "avoid": "Не говорить: «Это всего несколько процентов» или «Все так работают»."}, {"title": "«У нас и так полная заполняемость»", "tags": ["Загрузка", "Нет потребности"], "quotes": ["«У нас маленький отель, и у нас и так заполняемость полная.»", "«На лето у нас всё забронировано, нам сейчас это неактуально.»", "«С шестнадцатого июля пока полная загрузка.»"], "answer": "Это отличный результат. Тогда нет смысла обсуждать уже заполненные даты. Предлагаю посмотреть на сентябрь, межсезонье, будние дни или категории номеров, которые обычно закрываются последними.", "question": "Какие месяцы, дни недели или категории номеров у вас обычно заполняются слабее?", "argument": "Не спорьте с высокой загрузкой. Переведите разговор на будущие и менее загруженные периоды.", "next": "Зафиксировать дату повторного контакта перед началом более слабого сезона.", "avoid": "Не доказывать клиенту, что его загрузка недостаточно высокая."}, {"title": "«Позвоните где-нибудь через месяц»", "tags": ["Отсрочка", "Перезвон"], "quotes": ["«Давайте вы нам позвоните где-нибудь через месяц.»", "«Смогу решить эти вопросы чуть позже, не сейчас.»", "«Сейчас мне нужно идти, у меня гости.»"], "answer": "Конечно, понимаю. Чтобы не возвращаться к вопросу в неудобный момент, давайте сразу выберем конкретный день и время. Я к звонку подготовлю только информацию по вашему объекту, чтобы разговор занял не больше пяти–семи минут.", "question": "В какой день и время вам будет удобнее вернуться к вопросу?", "argument": "Ключевая задача — получить конкретную договорённость, а не неопределённое разрешение «перезвонить позже».", "next": "Назначить точную дату и зафиксировать тему следующего разговора.", "avoid": "Не заканчивать разговор фразой: «Хорошо, тогда как-нибудь перезвоню»."}, {"title": "«Пришлите подробную информацию»", "tags": ["Почта", "Материалы"], "quotes": ["«Пришлите, пожалуйста, подробную информацию.»", "«Вы можете мне прислать что-то типа брошюры на почту, чтобы я почитал?»", "«Пришлите предложение с описанием этих условий.»"], "answer": "Конечно, отправлю. Чтобы письмо было полезным, уточните, пожалуйста, что для вас важнее увидеть: условия участия, механику подключения или расчёт возможного результата?", "question": "Когда будет удобно созвониться после того, как вы посмотрите материалы?", "argument": "Персонализируйте письмо под конкретный вопрос клиента и обязательно договоритесь о следующем контакте.", "next": "Отправить материалы и назначить короткий повторный звонок.", "avoid": "Не отправлять общую презентацию без договорённости о дальнейшем шаге."}, {"title": "«Собственник не хочет больше пятнадцати процентов»", "tags": ["Согласование", "Собственник"], "quotes": ["«Мой собственник, например, не хочет.»", "«Он себе решил, что больше пятнадцати не даёт комиссии.»", "«Мне придётся встретиться с собственником.»"], "answer": "Понимаю. Давайте подготовим для собственника короткое обоснование не только по комиссии, но и по возможному результату для объекта. Так решение будет приниматься на основании полной экономики, а не одного процента.", "question": "Что для собственника будет главным аргументом: дополнительный доход, загрузка в слабые даты или условия подключения?", "argument": "Помогите собеседнику продать идею внутри компании. Дайте краткую и понятную структуру для ЛПР.", "next": "Предложить совместный звонок с собственником или отправить короткое резюме для согласования.", "avoid": "Не просить сотрудника самостоятельно «убедить собственника» без материалов."}, {"title": "«У нас бухгалтер не хочет платить комиссию»", "tags": ["Согласование", "Бухгалтерия"], "quotes": ["«У нас бухгалтер не хочет платить вам комиссию двадцать процентов.»", "«Сейчас у нас бухгалтер сидит, и я не могу её поднять оттуда.»"], "answer": "Понимаю. Для бухгалтерии важно видеть прозрачную механику начисления и финансовый результат. Я могу кратко описать, когда применяется комиссия и как оценить чистый доход по бронированиям.", "question": "Какой вопрос бухгалтерии нужно закрыть в первую очередь: размер комиссии, документы или порядок начисления?", "argument": "Говорите на языке прозрачности и расчётов. Не пытайтесь убеждать бухгалтера только маркетинговыми преимуществами.", "next": "Подготовить письменное описание условий или предложить короткий разговор с бухгалтерией.", "avoid": "Не противопоставлять бухгалтерию бизнесу и не обесценивать её опасения."}, {"title": "«Как это вообще должно работать?»", "tags": ["Условия", "Непонимание"], "quotes": ["«По корпоративному направлению там условия какие?»", "«Мы что-то платим вам как абонентскую плату или как?»", "«Как это вообще всё должно быть?»"], "answer": "Давайте разберём механику по шагам: что подключается, для каких бронирований действуют условия, когда возникает комиссия и как можно проверить результат. После этого отвечу на вопросы по каждому пункту.", "question": "Что сейчас непонятнее всего: стоимость, принцип работы, подключение или возможность отключения?", "argument": "Не перегружайте клиента всей презентацией. Сначала найдите конкретный непонятный элемент и объясните его простыми словами.", "next": "Закрыть один ключевой вопрос и проверить, остались ли сомнения.", "avoid": "Не использовать внутренние термины без пояснения."}, {"title": "«От него вообще никакого толку не было»", "tags": ["Негативный опыт", "Нет результата"], "quotes": ["«По-моему, от него вообще никакого толку не было.»", "«Это не работает у нас.»", "«У нас не сработало.»"], "answer": "Понимаю вашу реакцию. Давайте не спорить с прошлым результатом, а разберём, в каких условиях программа была подключена: какие даты были открыты, какие цены стояли и какой период вы оценивали.", "question": "По какому показателю вы поняли, что программа не сработала?", "argument": "Признайте опыт клиента. Проверьте период, доступность, цены и критерий оценки результата.", "next": "Провести короткую диагностику и только после неё предлагать повторное подключение.", "avoid": "Не говорить: «Вы неправильно настроили» или «В этот раз точно всё получится»."}, {"title": "«Мы пока не стремимся к тому, чтобы нас узнали»", "tags": ["Строительство", "Ограничение спроса"], "quotes": ["«Мы пока не стремимся к тому, чтобы нас узнали.»", "«Мы пока в активной фазе строительства.»", "«После того как гости узнают, что у нас благоустройство делают, идут отмены.»"], "answer": "Понимаю. В такой ситуации дополнительное продвижение действительно может быть преждевременным. Важно сначала определить срок завершения работ и период, когда объект будет готов принимать больше гостей без риска негативного опыта.", "question": "Когда планируется завершить основные работы и начать активнее наращивать загрузку?", "argument": "Не продавайте продукт вопреки операционной готовности объекта. Сохраните доверие и подготовьте будущий контакт.", "next": "Назначить возвращение к вопросу ближе к завершению работ.", "avoid": "Не убеждать клиента подключаться прямо сейчас любой ценой."}, {"title": "«У нас свои корпоративные клиенты»", "tags": ["Корпоративные продажи", "Другие каналы"], "quotes": ["«У нас свои корпоративные клиенты.»", "«Мы с ними работаем плотно, у нас от них идут гости.»", "«У нас только командировочные.»"], "answer": "Это сильная база. Мы не предлагаем заменить прямые корпоративные договорённости. Можно оценить, способен ли дополнительный канал привлекать новые организации и закрывать периоды, которые текущая база не заполняет.", "question": "Есть ли месяцы или дни недели, когда текущего корпоративного потока недостаточно?", "argument": "Позиционируйте предложение как дополнение, а не замену уже работающей модели.", "next": "Определить свободные периоды и обсудить только их.", "avoid": "Не обесценивать прямые корпоративные связи клиента."}, {"title": "«У нас нет доступа в личный кабинет»", "tags": ["Технический вопрос", "Доступ"], "quotes": ["«В личный кабинет не можем выйти.»", "«К старому кабинету у меня нет доступа и не будет доступа.»", "«У нас нет такого раздела.»"], "answer": "Понимаю. Сначала определим, где именно ограничение: вход в кабинет, права пользователя или настройка через менеджер каналов. После этого выберем правильный путь и не будем проходить лишние шаги.", "question": "У кого сейчас есть доступ к управлению объектом и настройкам тарифов?", "argument": "Разделите техническую проблему на конкретные причины. При необходимости подключите поддержку или ответственного пользователя.", "next": "Зафиксировать ответственного и первый технический шаг.", "avoid": "Не говорить клиенту, что всё «просто» или что он ищет не там, пока причина не установлена."}, {"title": "«Это работает только в Москве»", "tags": ["Регион", "Сомнение в спросе"], "quotes": ["«Это может быть работает в Москве или Санкт-Петербурге.»", "«Мы не туристическое место.»", "«У нас только командировочные.»"], "answer": "Понимаю сомнение. Для вашего объекта важен не общий туристический спрос, а конкретные сценарии региона: командировки, транзитные поездки, мероприятия и сезонные периоды. Давайте оценим, какие из них применимы именно к вам.", "question": "Кто чаще всего останавливается у вас и в какие периоды остаются свободные номера?", "argument": "Не используйте общие обещания. Привязывайте ценность к реальному типу гостей и спросу в регионе.", "next": "Сформулировать предложение под конкретный сегмент гостей.", "avoid": "Не сравнивать региональный объект с Москвой и Санкт-Петербургом."}];
const list=document.getElementById('list');
const content=document.getElementById('content');
const search=document.getElementById('search');

function esc(s){
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function renderList(){
  const q=search.value.toLowerCase().trim();
  list.innerHTML='';
  data
    .filter(x=>[x.title,...x.quotes,...x.tags].join(' ').toLowerCase().includes(q))
    .forEach(x=>{
      const b=document.createElement('button');
      b.className='objection';
      b.textContent=(x.tags&&x.tags.length)?x.tags.join(' / '):x.title.replace(/[«»"]/g,'');
      b.onclick=()=>show(x,b);
      list.appendChild(b);
    });

  if(!list.children.length){
    list.innerHTML='<p style="color:#777;padding:10px">Ничего не найдено</p>';
  }
}

function show(x,b){
  document.querySelectorAll('.objection').forEach(e=>e.classList.remove('active'));
  b.classList.add('active');
  content.className='';

  const objectionName=(x.tags&&x.tags.length)
    ? x.tags.join(' / ')
    : x.title.replace(/[«»"]/g,'');

  content.innerHTML=`
    <h2>${esc(objectionName)}</h2>

    <div class="quotes">
      <h3>Так говорит клиент</h3>
      ${x.quotes.map(q=>`<blockquote>${esc(q)}</blockquote>`).join('')}
    </div>

    <div class="answer">
      <h3>Отработка возражения</h3>
      <p>${esc(x.answer)}</p>
      <button class="copy">Скопировать ответ</button>
    </div>

    <div class="section">
      <h3>Что уточнить</h3>
      <p>${esc(x.question)}</p>
    </div>

    <div class="section">
      <h3>Аргументация</h3>
      <p>${esc(x.argument)}</p>
    </div>

    <div class="section">
      <h3>Следующий шаг</h3>
      <p>${esc(x.next)}</p>
    </div>

    <div class="section warning">
      <h3>Чего избегать</h3>
      <p>${esc(x.avoid)}</p>
    </div>`;

  const copy=content.querySelector('.copy');
  copy.onclick=async()=>{
    await navigator.clipboard.writeText(x.answer);
    copy.textContent='Скопировано';
    copy.classList.add('done');
    setTimeout(()=>{
      copy.textContent='Скопировать ответ';
      copy.classList.remove('done');
    },1600);
  };
}

search.oninput=renderList;
renderList();
</script>
</body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Playbook — навигатор переговоров</title><style>
:root{--ink:#151515;--muted:#6f747a;--bg:#f2f3f5;--card:#fff;--line:#e5e7ea;--accent:#ffcc00}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.side{height:100vh;position:sticky;top:0;background:#151515;color:#fff;padding:22px 18px;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:15px;background:#ffcc00;color:#111;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{color:#a5a8ad;font-size:12px;margin:4px 0}.projects{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.pbtn{border:1px solid #393939;background:#232323;color:#ddd;border-radius:999px;padding:8px 10px;font-size:12px;cursor:pointer}.pbtn.active{background:#fff;color:#111;border-color:#fff;font-weight:800}.search{width:100%;border:1px solid #3b3b3b;background:#222;color:#fff;border-radius:14px;padding:12px;margin-bottom:14px;outline:none}.search:focus{border-color:#ffcc00}.count{font-size:11px;color:#8f9499;margin:8px}.list{display:grid;gap:8px}.item{border:1px solid #303030;background:#222;color:#eee;text-align:left;padding:12px;border-radius:14px;cursor:pointer;line-height:1.35;font-size:13px}.item:hover{background:#2c2c2c}.item.active{background:#ffcc00;color:#111;border-color:#ffcc00;font-weight:800}.main{padding:28px}.wrap{max-width:1120px;margin:auto}.hero{background:#fff;border:1px solid var(--line);border-radius:26px;padding:25px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.kicker{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.13em;color:#777}.hero h2{font-size:34px;margin:7px 0 8px}.hero p{color:var(--muted);line-height:1.5;margin:0}.projectIcon{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:34px;font-weight:900}.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.fact{background:#f4f5f6;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px}.empty{min-height:520px;background:#fff;border:1px solid var(--line);border-radius:26px;display:grid;place-items:center;text-align:center;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.045)}.quote{font-size:28px;line-height:1.2;margin:0 0 8px}.intent{color:var(--muted);margin-bottom:20px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.flow span{background:#f5f5f5;border-radius:12px;padding:10px;text-align:center;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.block{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.block h3{font-size:14px;margin:0 0 9px}.block p{margin:0;line-height:1.55}.wide{grid-column:1/-1}.diagnose{background:#edf5ff}.join{background:#fff8d8}.argument{background:#eef9f2;border-color:#cfead7}.close{background:#f3efff}.fallback{background:#fff3e8}.avoid{background:#fff0ed}.speech{border-left:5px solid var(--project);font-size:18px}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.copy{border:0;background:#151515;color:white;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.copy.done{background:#219653}.next{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.mobileProject{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.main{padding:14px}.list{max-height:350px;overflow:auto}.hero{grid-template-columns:1fr}.projectIcon{display:none}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.flow{grid-template-columns:1fr 1fr}.quote{font-size:23px}} </style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">Я</div><div><h1>Sales Playbook</h1><p>Навигатор переговоров</p></div></div><div id="projects" class="projects"></div><input id="search" class="search" placeholder="Введите фразу клиента…"><div id="count" class="count"></div><div id="list" class="list"></div></aside><main class="main"><div class="wrap"><section id="hero" class="hero"></section><section id="content" class="empty"><div><div style="font-size:44px">💬</div><h2>Выберите фразу клиента</h2><p>Откроется индивидуальный сценарий аргументации.</p></div></section></div></main></div><script>const DB={"premium":{"name":"Premium","icon":"★","color":"#ffcc00","pitch":"Продвижение объекта в поисковой выдаче: больше видимости, переходов и бронирований без снижения открытой цены.","facts":["Приоритетное ранжирование и бейдж «Рекомендуем»","Управление участием со стороны объекта","Фокус на конкурентных условиях и прямой доступности"],"scenarios":[{"quote":"«У нас и так хорошая загрузка»","intent":"Клиент не видит дополнительной задачи для продвижения.","diagnose":"Какие периоды, дни недели или категории номеров обычно закрываются последними?","join":"Это отличный показатель — значит, базовый спрос у объекта уже сформирован.","bridge":"Тогда предлагаю не оценивать программу по уже заполненным датам, а посмотреть на те периоды, где остается недополученный доход.","argument":"Premium имеет смысл использовать точечно: для межсезонья, будних дней и категорий, которые продаются медленнее. Так программа не заменяет работающий спрос, а помогает добрать то, что без дополнительной видимости могло остаться непроданным.","proof":"Самый дорогой номер для объекта — тот, который остался пустым при сохранении постоянных расходов.","close":"Если определим слабые даты, готовы рассмотреть подключение именно под них?","fallback":"Можно начать с ограниченного периода и заранее согласовать критерий результата.","avoid":"Не спорить с загрузкой и не говорить, что клиент ошибается."},{"quote":"«Комиссия слишком высокая»","intent":"Клиент сомневается в окупаемости, а не только в проценте.","diagnose":"Для вас принципиален сам процент или важно понять, какой дополнительный доход он даст?","join":"Согласна, дополнительная комиссия должна быть экономически оправдана.","bridge":"Поэтому правильнее сравнивать не комиссию с нулем, а доход от дополнительной брони с доходом от непроданного номера.","argument":"Расход возникает только при состоявшемся бронировании. Если программа приводит гостя, которого объект без продвижения не получил бы, отель сохраняет положительный доход после комиссии и дополнительно получает выручку от питания и услуг.","proof":"В комиссию площадки уже входят привлечение аудитории, платежная инфраструктура и продвижение предложения.","close":"Давайте посчитаем на вашем среднем чеке, сколько дополнительных броней нужно, чтобы участие было выгодным?","fallback":"Предложить расчет на одном месяце или слабом периоде.","avoid":"Не сравнивать комиссии конкурентов без актуальной подтвержденной информации."},{"quote":"«Не хочу снижать цену»","intent":"Клиент боится потерять ADR и обесценить продукт.","diagnose":"Правильно понимаю, что для вас важно сохранить текущую открытую цену и позиционирование?","join":"Это логично: постоянные скидки действительно могут приучить гостя ждать более низкую цену.","bridge":"Именно поэтому Premium стоит отделять от скидочного продвижения.","argument":"Основная ценность — повышение видимости и доверия за счет позиции и бейджа, а не обязательное снижение открытого тарифа. Объект получает больше шансов быть замеченным, сохраняя свою ценовую стратегию.","proof":"Программа строится вокруг продвижения и конкурентных условий бронирования, а не вокруг бесконечного демпинга.","close":"Если открытую цену сохраняем, а усиливаем только видимость, такой формат вам ближе?","fallback":"Сравнить с расходами на собственную рекламу и SEO.","avoid":"Не обещать гарантированный объем бронирований."},{"quote":"«Мы развиваем прямые продажи»","intent":"Клиент воспринимает площадку как конкурента своему сайту.","diagnose":"Есть ли периоды, когда прямого спроса недостаточно для плановой загрузки?","join":"Развитие прямого канала — правильная и выгодная стратегия.","bridge":"Но прямой канал и площадка решают разные задачи и могут работать вместе.","argument":"Прямые продажи удерживают уже знакомую аудиторию, а Premium помогает объекту быть заметнее для новых путешественников в момент выбора. Это не замена сайту, а дополнительный источник первого знакомства с объектом.","proof":"Пользователь часто изучает объект на нескольких ресурсах перед решением, поэтому дополнительная видимость усиливает общий спрос на бренд.","close":"Готовы использовать Premium как канал привлечения новых гостей, не сокращая работу с прямыми продажами?","fallback":"Предложить оценивать не долю каналов, а общий прирост дохода.","avoid":"Не обесценивать прямой канал клиента."},{"quote":"«Мы уже пробовали — результата не было»","intent":"Негативный опыт без понятного критерия оценки.","diagnose":"По какому показателю вы оценивали результат и какие даты были открыты в тот период?","join":"Понимаю, после неудачного опыта повторно подключаться без разбора причин не хочется.","bridge":"Предлагаю сначала отделить эффективность инструмента от условий, в которых он работал.","argument":"На результат влияют доступность, конкурентность предложения, сезон, рейтинг и длительность теста. Если хотя бы один элемент был ограничен, рост видимости мог не превратиться в бронирования. Сначала проведем короткую диагностику, затем решим, есть ли смысл повторять.","proof":"Оценка должна идти по цепочке: показы → просмотры → конверсия → бронирования → доход.","close":"Если найдем конкретное ограничение и исправим его, готовы протестировать повторно на согласованном периоде?","fallback":"Зафиксировать метрики до старта и дату проверки.","avoid":"Не говорить «в прошлый раз вы неправильно настроили»."}]},"premium_pro":{"name":"Premium PRO","icon":"◆","color":"#7b61ff","pitch":"Максимальный уровень продвижения для объектов, которые хотят занять лидирующие позиции в своем регионе.","facts":["Усиленное ранжирование и выделенный пин","Дополнительные маркетинговые размещения","Инструменты SuperBoost и показы в сценариях Авиа/ЖД"],"scenarios":[{"quote":"«Чем PRO отличается от обычного Premium?»","intent":"Клиент не понимает ценность более высокого уровня.","diagnose":"Для вас приоритетнее максимальная позиция в выдаче или дополнительные маркетинговые размещения?","join":"Справедливый вопрос: без четкой разницы переплачивать за уровень PRO нет смысла.","bridge":"Разница не в названии, а в объеме инструментов продвижения.","argument":"Premium улучшает позицию объекта, а PRO дает усиленный буст и дополнительные точки контакта: выделенный пин, маркетинговые подборки, сценарии после покупки авиа- и ж/д билетов, SuperBoost и другие размещения. Это формат для объекта, которому важно не просто стать заметнее, а бороться за лидерство в регионе.","proof":"В материалах программы отдельно выделены инструменты, доступные только уровню PRO.","close":"Если ваша задача — войти в число самых заметных объектов региона, готовы рассмотреть PRO как комплекс, а не только комиссию?","fallback":"Сопоставить каждый инструмент с конкретной задачей объекта.","avoid":"Не обещать фиксированное место в выдаче."},{"quote":"«25% — это слишком много»","intent":"Клиент сравнивает ставку без учета дополнительного пакета продвижения.","diagnose":"С чем вы сравниваете эту стоимость: с обычной комиссией или с бюджетом на самостоятельное продвижение?","join":"Да, это существенная ставка, и ее важно рассматривать только при наличии задачи на активный рост.","bridge":"PRO — не базовое размещение, а расширенный маркетинговый пакет с оплатой за реализованное бронирование.","argument":"Объект получает не один рекламный формат, а набор каналов: усиленную выдачу, специальные блоки, проморазмещения и бонусные инструменты. При самостоятельной покупке такого охвата расходы возникают заранее и без гарантии продажи; здесь затрата привязана к факту бронирования.","proof":"В материалах указаны ориентиры роста просмотров и бронирований участников, но результат зависит от объекта и условий участия.","close":"Давайте сравним ставку с вашим текущим бюджетом привлечения одного бронирования — после этого решение будет предметным?","fallback":"Предложить ограниченный тест и расчет чистого дохода.","avoid":"Не называть прогноз гарантией."},{"quote":"«Нам достаточно обычного Premium»","intent":"Клиент не видит задачи, которую решает PRO.","diagnose":"Вы хотите просто поддержать текущую видимость или увеличить долю спроса относительно конкурентов?","join":"Вполне возможно, что для вашей текущей задачи Premium действительно достаточен.","bridge":"PRO стоит предлагать только тогда, когда есть более амбициозная цель.","argument":"Если объект уже стабильно продается и не планирует усиление, переплачивать не нужно. Но если важно быстрее наращивать долю, продвигать новый корпус, входить в сезон или занять лидирующие позиции, дополнительные точки контакта PRO сокращают путь к этой цели.","proof":"Выбор уровня должен зависеть от бизнес-задачи, а не от универсальной рекомендации.","close":"Есть ли у вас на ближайшие месяцы задача, для которой текущей видимости недостаточно?","fallback":"Если нет — зафиксировать возврат к теме перед сезоном или запуском нового продукта.","avoid":"Не продавать PRO любой ценой."},{"quote":"«Мы не уверены, что ваш маркетинг даст результат»","intent":"Клиент не доверяет влиянию видимости на продажи.","diagnose":"Где сейчас основное ограничение: мало просмотров карточки или просмотры есть, но бронирований недостаточно?","join":"Согласна: само по себе размещение логотипа или бейджа не является результатом.","bridge":"Поэтому важно понять, на каком этапе воронки объект теряет гостей.","argument":"Если мало просмотров, PRO расширяет охват. Если просмотры есть, но нет бронирований, сначала нужно проверить цену, контент, доступность и отзывы. Мы не предлагаем закрывать продуктовую проблему рекламой — сначала определяем узкое место, затем применяем подходящий инструмент.","proof":"Эффективная работа строится по воронке, а не по обещанию «будет больше продаж».","close":"Давайте сначала посмотрим вашу воронку и только после этого решим, нужен ли PRO?","fallback":"Провести диагностику карточки и предложения.","avoid":"Не говорить, что маркетинг обязательно окупится."},{"quote":"«Давайте вернемся к этому позже»","intent":"Отсрочка без конкретной причины или срока.","diagnose":"Позже — это ближе к сезону, после согласования бюджета или после оценки текущих продаж?","join":"Конечно, важно выбрать момент, когда инструмент действительно нужен.","bridge":"Чтобы не возвращаться к вопросу формально, давайте привяжем контакт к событию.","argument":"PRO особенно актуален до начала периода, в котором объекту нужна повышенная видимость: запуск сезона, нового корпуса, ремонт после открытия или просадка спроса. Если подключаться после того, как даты уже прошли, инструмент не сможет вернуть потерянный спрос.","proof":"Продвижение стоит планировать заранее, а не после появления пустых дат.","close":"Какую дату или показатель зафиксируем как точку возвращения к разговору?","fallback":"Назначить точный повторный контакт и подготовить расчет.","avoid":"Не соглашаться на неопределенное «когда-нибудь»."}]},"b2b":{"name":"B2B-тариф","icon":"▣","color":"#4f7cff","pitch":"Закрытый тариф для корпоративной аудитории, помогающий загружать будни и низкий сезон.","facts":["Тариф видят только корпоративные пользователи","Минимальная скидка — от 5%","Бейдж и фильтр для бизнес-поездок"],"scenarios":[{"quote":"«У нас уже есть свои корпоративные клиенты»","intent":"Клиент считает дополнительный канал ненужным.","diagnose":"Есть ли компании или периоды, которые текущая корпоративная база не закрывает?","join":"Это сильная позиция — собственные корпоративные договоры дают предсказуемый спрос.","bridge":"B2B-тариф не должен заменять эти отношения.","argument":"Закрытый тариф открывает доступ к компаниям, которые бронируют только через корпоративные сервисы и не выйдут в объект напрямую. Он расширяет базу и снижает зависимость от нескольких текущих договоров.","proof":"Корпоративные поездки распределены круглый год и часто поддерживают будничную загрузку.","close":"Если тариф приведет новые компании, не затрагивая действующие договоры, готовы протестировать?","fallback":"Открыть только отдельные категории или периоды.","avoid":"Не говорить, что прямые договоры хуже."},{"quote":"«Не дадим скидку 5%»","intent":"Клиент защищает цену или не понимает закрытость тарифа.","diagnose":"Причина в маржинальности или вы не хотите, чтобы сниженная цена была видна обычным гостям?","join":"Понимаю: открытое снижение цены может повлиять на позиционирование.","bridge":"Здесь принципиально важно, что тариф закрытый.","argument":"Его видит только корпоративная аудитория. Минимальные 5% — вход в отдельный сегмент, где прямые корпоративные запросы нередко предполагают более глубокую скидку. Начать можно с минимального уровня, оценить объем и затем управлять условиями.","proof":"Тариф можно ограничивать по категориям, периодам и доступности.","close":"Если цена не выходит в открытый рынок и начинаем с минимальных 5%, готовы проверить спрос?","fallback":"Сравнить с действующими СПО и корпоративными скидками объекта.","avoid":"Не говорить «это всего 5%» — для клиента это деньги."},{"quote":"«У нас нет корпоративного спроса»","intent":"Клиент делает вывод по текущей структуре гостей.","diagnose":"Вы не видите запросов от компаний вообще или они приходят, но не конвертируются?","join":"Понимаю: если сейчас деловых гостей мало, предложение может казаться нерелевантным.","bridge":"Но отсутствие текущих броней не всегда означает отсутствие потенциального спроса.","argument":"Корпоративный пользователь ищет объекты с подходящим закрытым предложением и фильтром бизнес-поездок. Без B2B-тарифа объект может просто не попадать в его сценарий выбора. Подключение — способ проверить сегмент, а не признание, что он уже развит.","proof":"Деловые гости ценят документы, стабильность, питание, трансфер и удобство локации — не только бизнес-центры мегаполисов.","close":"Давайте определим, есть ли у вашего объекта хотя бы два признака удобства для командировок, и на их основе протестируем тариф?","fallback":"Предложить тест на будние даты низкого сезона.","avoid":"Не утверждать, что спрос точно есть в любом регионе."},{"quote":"«Корпоративные гости нам невыгодны»","intent":"Негативный опыт или расчет только по цене номера.","diagnose":"Что именно было невыгодно: скидка, документы, короткое проживание или дополнительные требования?","join":"Да, отдельные корпоративные договоры могут создавать много ручной работы.","bridge":"Но закрытый тариф через площадку устроен иначе.","argument":"Объект получает бронирование в стандартном процессе, а ценность гостя складывается не только из номера: питание, трансфер, прачечная, конференц-услуги, продление на выходные. Кроме того, деловые бронирования помогают закрывать будни и снижают сезонность.","proof":"Корпоративный сегмент обычно оценивают по общей выручке и повторяемости, а не только ADR первой брони.","close":"Если исключим лишнюю ручную работу и посчитаем общий чек, готовы заново оценить сегмент?","fallback":"Разобрать один прошлый кейс клиента.","avoid":"Не обещать более высокий чек каждому объекту."},{"quote":"«Не хотим повышенную комиссию»","intent":"Клиент не видит дополнительной ценности закрытого сегмента.","diagnose":"Вы рассматриваете B2B как тот же открытый тариф или как отдельный канал привлечения?","join":"Логично сравнивать дополнительную ставку с дополнительным результатом.","bridge":"B2B — это не просто изменение процента на той же аудитории.","argument":"Тариф дает доступ к закрытому корпоративному спросу, специальному фильтру и выделению. Если объект уже участвует в Premium/PRO и ставка не меняется по вашим условиям, затрата фактически ограничивается скидкой. В остальных случаях нужно считать чистый доход именно от новых корпоративных броней.","proof":"Решение лучше принимать по экономике отдельного сегмента.","close":"Посчитаем на вашем среднем будничном тарифе, какой доход останется после всех условий?","fallback":"Предложить Excel-расчет на фактических показателях объекта.","avoid":"Не использовать устаревшую ставку без проверки условий объекта."}]},"kids":{"name":"Детские тарифы","icon":"●","color":"#ff8a3d","pitch":"Настройка корректной стоимости размещения детей, чтобы семьи могли найти и забронировать объект.","facts":["Рост конверсии семейного спроса","Загрузка номеров на 3–4 гостей","Дополнительный доход от питания и услуг"],"scenarios":[{"quote":"«Дети у нас и так могут жить»","intent":"Клиент путает физическую возможность размещения с корректным поиском и расчетом.","diagnose":"При поиске семьи система сразу показывает точную итоговую стоимость или гость должен уточнять ее отдельно?","join":"Отлично, значит сам продукт для семей у вас уже есть.","bridge":"Остается сделать так, чтобы семья могла корректно найти и забронировать его онлайн.","argument":"Если детские условия не настроены, семья может увидеть неверную цену, отсутствие варианта размещения или необходимость звонить. Каждый дополнительный шаг снижает конверсию и уводит гостя к объекту, где итоговая стоимость понятна сразу.","proof":"Тариф превращает существующую возможность размещения в доступный для бронирования продукт.","close":"Если настройка уберет необходимость ручного уточнения, готовы ее сделать?","fallback":"Предложить пройти один тестовый поиск вместе.","avoid":"Не говорить, что объект не работает с детьми."},{"quote":"«Мы не хотим давать детям скидку»","intent":"Клиент воспринимает детский тариф только как дисконт.","diagnose":"Вам важно сохранить доход с места или текущая модель размещения детей уже рассчитана отдельно?","join":"Согласна, детский тариф не должен делать семейное бронирование убыточным.","bridge":"Настройка — это не обязательно бесплатное проживание или большая скидка.","argument":"Задача — передать реальную ценовую политику объекта по возрастам и типам размещения. Можно установить стоимость, которая сохраняет маржинальность, но делает итоговый расчет прозрачным для семьи.","proof":"Даже небольшой ценовой дифференциал может повысить конкурентность общего чека без снижения взрослого тарифа.","close":"Давайте настроим фактические условия, которые у вас уже действуют офлайн?","fallback":"Сравнить итоговую стоимость семьи с конкурентами.","avoid":"Не обещать, что скидка всегда увеличит прибыль."},{"quote":"«У нас мало семей с детьми»","intent":"Клиент оценивает только текущую аудиторию.","diagnose":"Семьи не выбирают ваш объект или не могут корректно увидеть условия при поиске?","join":"Понимаю: при небольшом потоке кажется, что настройка не приоритетна.","bridge":"Но текущая доля семей может быть следствием отсутствия понятного предложения.","argument":"Семья указывает состав гостей еще на этапе поиска. Если система не может рассчитать размещение, объект исключается до просмотра карточки. Настройка позволяет сначала стать доступным этой аудитории, а затем оценить реальный спрос.","proof":"Семейные бронирования часто включают больше гостей, более длинное проживание и дополнительные услуги.","close":"Готовы настроить тариф и через месяц проверить, изменилась ли доля семейных запросов?","fallback":"Начать с наиболее подходящих категорий номеров.","avoid":"Не называть семьи гарантированно самой платежеспособной аудиторией без данных объекта."},{"quote":"«Слишком сложно настраивать»","intent":"Технический барьер и страх ошибки.","diagnose":"Сложность в определении возрастов и цен или в самом интерфейсе?","join":"Да, если делать без понятной схемы, можно запутаться в возрастах и размещениях.","bridge":"Поэтому сначала фиксируем правила объекта, а потом переносим их в настройки.","argument":"Нужно определить четыре вещи: возрастные группы, стоимость места, питание и доступные категории. После этого настройка становится техническим переносом уже принятой политики, а не новым сложным продуктом.","proof":"Есть пошаговая инструкция, а менеджер может пройти настройку вместе с партнером.","close":"Давайте сейчас зафиксируем ваши правила и выберем время для совместной настройки?","fallback":"Отправить инструкцию и назначить конкретный созвон.","avoid":"Не отправлять ссылку без следующего шага."},{"quote":"«Семьи создают больше проблем»","intent":"Клиент опирается на негативные кейсы или операционные ограничения.","diagnose":"Какие сложности возникают чаще: шум, оснащение, питание или жалобы на условия?","join":"Понимаю, семейный сегмент требует большей готовности объекта.","bridge":"Подключать его стоит только там, где ожидания гостя совпадают с возможностями отеля.","argument":"Корректный тариф и описание помогают заранее задать условия: возраст, спальные места, питание и правила. Это снижает число недопониманий. При этом можно открыть семейное размещение только в подходящих категориях, не меняя весь номерной фонд.","proof":"Чем прозрачнее условия до оплаты, тем меньше конфликтов при заезде.","close":"Если ограничим предложение подходящими номерами и четко опишем условия, готовы рассмотреть?","fallback":"Сначала устранить операционную причину негатива.","avoid":"Не спорить с реальным негативным опытом."}]},"loyalty":{"name":"Программа лояльности","icon":"♥","color":"#ef4f87","pitch":"Инструмент заметности и возвращаемости для активной аудитории Яндекс Путешествий.","facts":["Специальный бейдж в выдаче","Гибкое управление датами и условиями","Работа на повторные бронирования"],"scenarios":[{"quote":"«Не хотим давать дополнительную скидку»","intent":"Клиент защищает ADR и маржу.","diagnose":"Вас больше беспокоит размер скидки или то, что она будет действовать в даты высокого спроса?","join":"Логично: скидка не должна применяться там, где номер и так продается.","bridge":"Сильная сторона программы — возможность управлять условиями.","argument":"Можно закрывать пиковые даты, менять параметры и использовать инструмент только там, где нужно усилить спрос. Тогда скидка становится не постоянной потерей дохода, а управляемой стоимостью привлечения лояльной аудитории.","proof":"Объект получает бейдж и дополнительную заметность для пользователей программы.","close":"Если исключим сильные даты и оставим только периоды с недозагрузкой, готовы протестировать?","fallback":"Составить календарь применения на месяц.","avoid":"Не предлагать скидку на весь год по умолчанию."},{"quote":"«У нас есть собственная программа лояльности»","intent":"Клиент воспринимает программы как взаимоисключающие.","diagnose":"Ваша программа работает в основном на повторных гостей или также привлекает новых?","join":"Собственная программа — важный инструмент удержания.","bridge":"Программа площадки решает другую часть задачи.","argument":"Она помогает привлечь пользователя, который уже лоялен экосистеме, но еще не знаком с вашим объектом. После первого проживания вы можете переводить его в собственные отношения и развивать повторные продажи.","proof":"Одна программа создает первый контакт, другая — удерживает гостя после знакомства.","close":"Готовы использовать программу Яндекс Путешествий как вход для новой аудитории, сохраняя собственную?","fallback":"Обсудить механику последующего удержания гостя.","avoid":"Не противопоставлять программы."},{"quote":"«Не верим, что бейдж влияет на выбор»","intent":"Клиент сомневается в ценности визуального выделения.","diagnose":"У вас сейчас проблема в количестве просмотров или в конверсии после просмотра?","join":"Согласна: один бейдж не заменит цену, отзывы и качественную карточку.","bridge":"Но в конкурентной выдаче он помогает пользователю быстрее заметить дополнительную выгоду.","argument":"Бейдж работает как сигнал: объект участвует в понятной пользователю программе. Он повышает шанс перехода при сопоставимых предложениях, а дальше решение принимается по всему продукту. Поэтому инструмент нужно применять вместе с конкурентной ценой, контентом и доступностью.","proof":"Заметность особенно важна, когда рядом много похожих объектов.","close":"Давайте сначала проверим карточку, а затем используем бейдж как усилитель готового предложения?","fallback":"Сравнить выдачу по ключевым датам.","avoid":"Не обещать рост только за счет значка."},{"quote":"«Сейчас высокий сезон, нам это не нужно»","intent":"Продукт неактуален в текущих датах, но может быть нужен позже.","diagnose":"Когда у вас обычно начинается снижение загрузки и какие дни проседают первыми?","join":"Согласна: в пик спроса стимулировать бронирования дополнительной выгодой может быть нерационально.","bridge":"Поэтому программу лучше планировать заранее на период после пика.","argument":"Можно закрыть сильные даты и включить инструмент только с момента, когда обычный спрос начинает снижаться. Так вы не жертвуете доходом в сезон и заранее создаете конкурентное предложение на межсезонье.","proof":"Условия участия можно корректировать со стороны объекта.","close":"Какую дату включения зафиксируем сейчас, чтобы не вернуться к вопросу слишком поздно?","fallback":"Поставить точный повторный контакт.","avoid":"Не убеждать подключать на уже заполненные даты."},{"quote":"«Мы не хотим привлекать охотников за скидками»","intent":"Клиент боится низкокачественной аудитории.","diagnose":"Под низкокачественным гостем вы имеете в виду низкий чек, отмены или отсутствие повторных визитов?","join":"Понимаю опасение: постоянный демпинг действительно может привлекать только чувствительную к цене аудиторию.","bridge":"Но лояльность — это не только минимальная цена.","argument":"Пользователь оценивает совокупную выгоду экосистемы, удобство оплаты и бонусы. Задача программы — выделить объект для активной аудитории, а не превратить его в самый дешевый вариант. Вы сами управляете размером выгоды и датами.","proof":"Качество гостя нужно оценивать по общему чеку, отменам и повторяемости, а не только по скидке.","close":"Готовы начать с минимального управляемого предложения и оценить качество фактических гостей?","fallback":"Зафиксировать метрики теста.","avoid":"Не утверждать, что все участники программы имеют высокий доход."}]},"breakfast":{"name":"Бесплатный завтрак","icon":"☕","color":"#20a36a","pitch":"Промо для активных участников программы лояльности с выделением объекта и фильтром «Все скидки и бонусы».","facts":["Бейдж «Бесплатный завтрак»","Повышение ценности предложения без прямого снижения цены номера","Можно управлять периодами участия"],"scenarios":[{"quote":"«Завтрак для нас слишком дорогой»","intent":"Клиент видит только себестоимость услуги.","diagnose":"Вы сравниваете стоимость завтрака с ценой номера или с затратой на привлечение дополнительной брони?","join":"Да, бесплатный завтрак — реальная себестоимость для объекта.","bridge":"Поэтому его стоит оценивать как маркетинговый инструмент, а не как подарок без цели.","argument":"Для гостя ценность завтрака обычно выше его себестоимости для отеля. Объект получает более привлекательное предложение, бейдж и попадание в фильтр, не снижая базовую цену номера. Если завтрак помогает получить бронь, затрата может быть ниже прямой скидки той же воспринимаемой ценности.","proof":"Особенно выгодно использовать промо в периоды, когда кухня уже работает и дополнительные переменные затраты ограничены.","close":"Давайте сравним себестоимость завтрака с размером скидки, которую пришлось бы дать для той же привлекательности?","fallback":"Ограничить промо выбранными датами и категориями.","avoid":"Не путать себестоимость с розничной ценой завтрака."},{"quote":"«У нас завтрак и так включен»","intent":"Клиент не понимает дополнительной механики.","diagnose":"Он включен во все тарифы или только в отдельные предложения?","join":"Отлично — значит, операционно продукт уже готов.","bridge":"Тогда основная ценность промо не в новом завтраке, а в дополнительной заметности.","argument":"Механика позволяет отдельно подчеркнуть выгоду для лояльной аудитории: бейдж в поиске и участие в фильтре. Пользователь быстрее понимает, что питание включено, а объект получает дополнительную точку отличия без изменения сервиса.","proof":"Четкое обозначение включенной услуги снижает неопределенность при сравнении тарифов.","close":"Если дополнительных затрат почти нет, готовы использовать уже существующий завтрак для усиления выдачи?","fallback":"Проверить корректность тарифов и стоимость завтрака в настройке.","avoid":"Не обещать, что промо не создаст вообще никаких затрат."},{"quote":"«Не хотим кормить всех бесплатно»","intent":"Клиент воспринимает предложение как массовую бессрочную льготу.","diagnose":"Вас беспокоит объем гостей или невозможность ограничить даты?","join":"Понимаю: бессрочная льгота для всех могла бы серьезно повлиять на экономику.","bridge":"Но механика адресная и управляемая.","argument":"Бонус предназначен определенной лояльной аудитории, а объект может задавать условия и периоды. Это не обязательство предоставлять бесплатный завтрак каждому гостю круглый год.","proof":"Промо можно закрывать в даты пиковой загрузки и корректировать условия.","close":"Если ограничим аудиторию и периоды, экономический риск снимается?","fallback":"Показать настройки и составить календарь.","avoid":"Не использовать слово «бесплатно» без объяснения условий."},{"quote":"«Бейдж ничего не изменит»","intent":"Клиент не верит в визуальное отличие.","diagnose":"Сколько похожих предложений пользователь видит рядом с вами в выдаче?","join":"Да, бейдж не исправит слабую цену или плохие отзывы.","bridge":"Но при сопоставимых вариантах он дает понятную дополнительную причину открыть карточку.","argument":"Завтрак — конкретная выгода, которую гость может оценить сразу. В отличие от абстрактного обещания качества, бейдж сокращает сравнение: пользователь видит, что часть расходов на поездку уже включена.","proof":"Дополнительно объект попадает в релевантный фильтр скидок и бонусов.","close":"Если карточка и цена конкурентны, готовы использовать бейдж как последний аргумент в сравнении?","fallback":"Предварительно проверить качество карточки.","avoid":"Не представлять бейдж единственным фактором бронирования."},{"quote":"«У нас нет кухни / завтраков»","intent":"Операционная невозможность продукта.","diagnose":"Есть ли партнерское кафе, наборы или доставка, которые объект уже предлагает гостям?","join":"Понимаю, без устойчивой возможности предоставить завтрак подключать промо нельзя.","bridge":"Сначала нужно решить продуктовую часть, а не продавать маркетинговый инструмент.","argument":"Если завтрак можно организовать через партнера с понятным качеством и учетом, промо станет способом монетизировать эту услугу и повысить ценность проживания. Если такой возможности нет — лучше не подключать и сосредоточиться на других инструментах лояльности.","proof":"Ожидания гостя должны полностью совпадать с фактической услугой.","close":"Есть ли реальный вариант организовать стабильный завтрак без риска для качества?","fallback":"Если нет — рекомендовать другой проект.","avoid":"Не уговаривать подключать услугу, которой объект не может обеспечить."}]},"competitive":{"name":"Конкурентные цены","icon":"↔","color":"#5b6cff","pitch":"Работа с ценовым разрывом, неполной выгрузкой тарифов, питанием и техническими ограничениями без давления на партнера.","facts":["Конкурентная цена влияет на видимость и конверсию","Сопоставимые условия помогают попадать в ценовые фильтры","Вместо требования — диагностика, аргумент и тест на данных"],"scenarios":[{"quote":"📌 Памятка: коммуникация по конкурентным ценам","intent":"Единые безопасные формулировки для звонков, переписки и комментариев по программе Premium.","diagnose":"Перед ответом уточните, что именно обсуждает партнер: публичную цену, условия тарифа, видимость объекта или эффективность участия в программе.","join":"Понимаю, что для вас важно сохранить контроль над тарифной политикой и экономикой продаж.","bridge":"Поэтому обсуждаем не обязательства и санкции, а качество и конкурентоспособность предложения для пользователя.","argument":"Используем формулировки: «конкурентоспособное предложение», «сопоставимые условия», «отсутствие существенного ценового разрыва», «эффективность участия в программе», «видимость и конверсия объекта», «попадание в поисковые сценарии и ценовые фильтры», «качество предложения для пользователя».","proof":"Не используем формулировки об обязательном паритете, требованиях, внутренних порогах, допустимых отклонениях и санкциях.","close":"Давайте посмотрим, как сделать предложение более конкурентоспособным и повысить эффективность участия объекта в программе?","fallback":"Если партнер просит назвать внутренний порог или допустимое отклонение, возвращаем разговор к сопоставимости условий, видимости, конверсии и качеству предложения для пользователя.","avoid":"Не говорить: «Вы обязаны соблюдать паритет»; «У вас нарушение паритета»; «Мы требуем держать цены не выше сайта»; «Если не выровняете цены, отключим / понизим / накажем»; «Мы вводим порог / допустимое отклонение X%»; «Вы должны дать нам такие же цены, как на сайте»; «Это условие доступа, поэтому вы обязаны его выполнить».","quick":["Конкурентоспособное предложение.","Сопоставимые условия.","Отсутствие существенного ценового разрыва.","Эффективность участия в программе.","Видимость и конверсия объекта.","Попадание в поисковые сценарии и ценовые фильтры.","Качество предложения для пользователя."]},{"quote":"«Скажите конкретно, насколько нужно скорректировать цену?»","intent":"Отельер заинтересован в Premium, видит небольшое отклонение и хочет получить точный процент или сумму.","diagnose":"Правильно понимаю, что вы готовы скорректировать тариф, но хотите убедиться, что речь не идет о существенном снижении?","join":"Понимаю: когда решение связано с экономикой номера, хочется получить конкретный и понятный ориентир.","bridge":"При этом мы не рекомендуем ориентироваться на фиксированный процент или внутренний порог — цены динамичны и меняются по датам.","argument":"В вашем случае речь скорее о небольшой корректировке, а не о полном пересмотре тарифной политики. Важно максимально приблизить предложение к вашим публичным условиям, чтобы оно выглядело конкурентоспособным для пользователя. Начните с минимального изменения и проверьте результат на актуальных датах.","proof":"Даже небольшая разница может влиять на сравнение предложений, особенно если она выводит объект за ценовой фильтр пользователя. Поэтому важна не конкретная цифра сама по себе, а сопоставимость цены в динамике.","close":"Давайте вы немного сократите текущую разницу, а после обновления мы повторно посмотрим ситуацию по актуальным датам?","fallback":"Если отельер продолжает просить цифру: «Точный порог назвать не смогу, потому что цены постоянно меняются. Но здесь не требуется существенного снижения — попробуйте минимально приблизить тариф к вашему публичному предложению, и затем проверим результат». ","avoid":"Не говорить: «снизьте на 2–5%», «вам не хватает 300–500 рублей», «сделайте минус 200 рублей» или «после этой суммы вы точно попадете в Premium».","quick":["Существенно пересматривать цену не нужно — достаточно немного сократить текущую разницу.","Здесь речь скорее о небольшой корректировке, чем о снижении тарифов.","Постарайтесь максимально приблизить цену к вашему публичному предложению.","Начните с минимальной корректировки, а затем мы повторно проверим актуальные даты.","Фиксированного ориентира нет: важна сопоставимость предложения в текущей динамике цен.","Наша задача — не сделать тариф дешевле рынка, а сделать его конкурентоспособным для пользователя."]},{"quote":"«Это специальное предложение только для нашего сайта»","intent":"Отель хочет сохранить преимущество прямого канала и считает, что гость перейдет на сайт.","diagnose":"Подскажите, эта цена доступна всем пользователям сайта или только закрытой базе лояльных гостей?","join":"Понимаю желание сохранять особые условия для прямых гостей — это нормальная часть стратегии лояльности.","bridge":"При этом важно разделить закрытые персональные предложения и публичную цену, которую видит новый пользователь.","argument":"Пользователь Яндекс Путешествий уже сравнивает объекты внутри сервиса, использует фильтры, бонусы и привычную оплату. Если ваш публичный тариф здесь заметно выше, он не обязательно перейдет на сайт — чаще выберет другой отель в той же выдаче. Закрытые скидки для постоянных гостей можно сохранить, но основные публичные условия лучше сделать сопоставимыми.","proof":"Сильный ценовой разрыв снижает конверсию и может исключить объект из выборки гостя по бюджету еще до открытия карточки.","close":"Давайте оставим закрытые преимущества для вашей базы, а публичные тарифы выровняем на тестовый период и сравним результат?","fallback":"Предложить тест на 1–2 месяца и сравнить позиции, просмотры, конверсию, бронирования и выручку.","avoid":"Не говорить: «Вы обязаны дать такую же цену» или «Это нарушение»."},{"quote":"«Мы хотим растить прямые продажи»","intent":"Отель воспринимает OTA как конкурента собственному сайту.","diagnose":"Как вы сейчас измеряете эффективность прямого канала и учитываете ли рекламу, эквайринг, модуль бронирования и обработку заявок?","join":"Развивать прямые продажи действительно выгодно и правильно.","bridge":"Но аудитория сайта и аудитория OTA часто не совпадают, поэтому один канал не обязательно отбирает продажи у другого.","argument":"Яндекс Путешествия дает доступ к новой аудитории, которая может не знать объект и не искать его сайт напрямую. Если предложение в сервисе дороже, пользователь чаще не переходит на сайт, а выбирает другого отельера внутри привычного интерфейса. Первое бронирование через OTA может стать началом прямых повторных продаж в будущем.","proof":"Прямое бронирование тоже имеет стоимость привлечения: реклама, сайт, модуль бронирования, эквайринг и работа сотрудников.","close":"Готовы оценивать не долю канала отдельно, а общий прирост новых гостей и дохода?","fallback":"Сравнить период с сопоставимыми ценами и период с наценкой по фактическим данным.","avoid":"Не противопоставлять прямые продажи и OTA."},{"quote":"«Мы намеренно завышаем вам цены»","intent":"Отель пытается компенсировать комиссию через наценку.","diagnose":"Вы сравнивали, как после введения наценки изменились позиции, конверсия и количество бронирований?","join":"Понимаю желание учесть комиссию в экономике канала.","bridge":"Но важно проверить, не обходится ли такая компенсация дороже самой комиссии.","argument":"Если цена становится неконкурентной, объект может терять показы, не попадать в фильтры по бюджету и получать меньше бронирований. Тогда отель экономит часть комиссии, но одновременно теряет выручку от непроданных номеров и дополнительных услуг. Решение стоит оценивать по итоговой прибыли, а не по проценту наценки.","proof":"Самый дорогой номер — непроданный: постоянные расходы сохраняются, а доход равен нулю.","close":"Давайте временно уберем наценку на выбранных датах и сравним финансовый результат?","fallback":"Начать с низкого сезона или категорий с неполной загрузкой.","avoid":"Не обвинять клиента в неправильной стратегии."},{"quote":"«Если вас не устраивает — можем закрыть продажи»","intent":"Клиент защищает свою ценовую политику и усиливает позицию угрозой закрытия канала.","diagnose":"Правильно понимаю, что основная причина — экономика канала, а не отсутствие спроса или техническая проблема?","join":"Понимаю, что вы хотите полностью контролировать условия продаж.","bridge":"Закрытие канала возможно, но сначала стоит сравнить его с менее радикальным вариантом.","argument":"Закрытие сокращает охват и доступ к новой аудитории, но не гарантирует, что эти гости перейдут на сайт. Они могут выбрать конкурента. Сопоставимые условия на ограниченном периоде дают и продажи, и данные для решения, тогда как закрытие сразу обнуляет потенциальный результат.","proof":"Закрытый канал не позволяет проверить, какой объем новых гостей и выручки объект мог бы получить.","close":"Предлагаю вместо закрытия провести тест на согласованных датах и после него принять решение на цифрах. Подойдет?","fallback":"Ограничить тест несколькими категориями или периодом межсезонья.","avoid":"Не отвечать угрозой и не давить последствиями."},{"quote":"«У нас наценка на все OTA»","intent":"Это системная политика объекта или сети, а не персональный отказ.","diagnose":"Какой фактический рост прямых продаж дала эта политика и сравнивали ли вы его с потерями бронирований в OTA?","join":"Понимаю, что у объекта может быть единая коммерческая модель для всех каналов.","bridge":"Но универсальная политика не всегда дает одинаковый результат в каждом канале.","argument":"Если наценка выводит объект за бюджет пользователя, он может вообще не увидеть карточку. Тогда рейтинг, фотографии и преимущества не участвуют в выборе. Важно проверить, компенсирует ли прирост прямых продаж потерю видимости и бронирований на площадках.","proof":"Даже сильный объект не продается пользователю, если не попал в его ценовую выборку.","close":"Готовы сделать исключение для тестового периода и сравнить результат с текущей моделью?","fallback":"Показать даты и категории, где ценовой разрыв наиболее критичен.","avoid":"Не требовать немедленного изменения всей сетевой политики."},{"quote":"«Не хотим выгружать дешевые номера и тарифы»","intent":"Отель боится низкого чека, жалоб по простым категориям или каннибализации более дорогих номеров.","diagnose":"Какие именно категории вы ограничиваете и действительно ли они загружены на 100% на всех датах?","join":"Понимаю желание управлять миксом категорий и не снижать средний чек.","bridge":"Но минимальная цена влияет не только на выбор номера, а на саму возможность увидеть объект.","argument":"Без доступных категорий отель может не попасть в ценовые фильтры и потерять показы. При этом пользователь, открывший карточку по доступной цене, нередко выбирает более комфортную категорию после сравнения условий. Особенности простых номеров можно честно отразить в описании, чтобы снизить риск ожиданий и жалоб.","proof":"Доступный входной тариф расширяет количество поисковых сценариев, в которых участвует объект.","close":"Давайте откроем часть доступных категорий на конкретные даты и посмотрим, как изменятся просмотры и итоговый средний чек?","fallback":"Ограничить количество номеров или даты вместо полного закрытия категории.","avoid":"Не обещать, что гости обязательно выберут более дорогой номер."},{"quote":"«Летом мы продаемся без OTA на 100%»","intent":"Клиент не видит ценности канала в высокий сезон.","diagnose":"А какие месяцы, дни недели или категории заполняются слабее вне пикового периода?","join":"Это отличный результат, в пик спроса дополнительное продвижение действительно может быть не главным приоритетом.","bridge":"Тогда стоит обсуждать не уже заполненное лето, а будущий спрос и межсезонье.","argument":"OTA работает не только как канал текущего бронирования, но и как витрина для новых гостей. Пользователь может впервые увидеть объект летом, запомнить его и вернуться в другой период. Полное выпадение из канала ослабляет узнаваемость и оставляет будущий спрос конкурентам.","proof":"Высокая сезонная загрузка не означает стабильную загрузку в течение всего года.","close":"Готовы сохранить конкурентные условия хотя бы на слабые даты и будущие периоды?","fallback":"Зафиксировать дату возвращения к вопросу перед межсезоньем.","avoid":"Не спорить с фактом полной загрузки."},{"quote":"«В высокий сезон нам OTA не нужен»","intent":"Отель считает, что высокий спрос гарантирует продажу по любой цене.","diagnose":"Все ли категории и даты в высокий сезон закрываются одинаково быстро?","join":"Согласна, высокий сезон снижает риск пустых номеров.","bridge":"Но одновременно в направлении растет конкуренция между объектами.","argument":"Гость продолжает сравнивать цены и использовать фильтры даже при высоком спросе. Неконкурентное предложение может проигрывать соседним объектам, а при участии в Premium еще и снижать эффективность оплаченного продвижения. Важно не просто присутствовать в выдаче, а оставаться привлекательным после клика.","proof":"Высокий спрос на направление не гарантирует выбор конкретного отеля.","close":"Давайте проверим конкурентность только по датам, которые закрываются медленнее, и не менять уже проданные пики?","fallback":"Сегментировать даты по фактической загрузке.","avoid":"Не утверждать, что объект обязательно потеряет продажи."},{"quote":"«У нас сетевое правило повышать тарифы для вашего канала»","intent":"У собеседника может не быть полномочий изменить условия.","diagnose":"Кто принимает решение по тарифной политике и какие данные нужны для внутреннего согласования исключения?","join":"Понимаю, что единая политика сети не меняется решением одного объекта.","bridge":"Тогда наша задача — подготовить аргументы и данные для владельца решения.","argument":"Системное завышение может снижать видимость и продажи всего канала, особенно в конкурентных направлениях. Это риск потерять больше выручки, чем сеть экономит на комиссии. Вместо общего спора можно выбрать несколько объектов или дат и провести контролируемый тест.","proof":"Тестовая группа позволяет сравнить результат без изменения политики всей сети.","close":"Кого лучше подключить к обсуждению, чтобы согласовать пилот на части объектов?","fallback":"Подготовить короткое резюме с метриками и предлагаемым тестом.","avoid":"Не просить сотрудника самостоятельно «продавить» решение без материалов."},{"quote":"«Гости всё равно перейдут на наш сайт»","intent":"Отель предполагает, что высокая цена в OTA стимулирует прямой переход.","diagnose":"У вас есть данные, сколько пользователей после просмотра в OTA действительно переходят и бронируют на сайте?","join":"Часть гостей действительно проверяет сайт объекта перед бронированием.","bridge":"Но такое поведение нельзя считать гарантированным для всей аудитории.","argument":"Пользователь может быть привязан к сервису из-за бонусов, поддержки, фильтров и удобной оплаты. Увидев более высокую цену, он часто сравнивает не каналы одного отеля, а другие объекты внутри сервиса. Поэтому ценовой разрыв может увеличить продажи конкурента, а не вашего сайта.","proof":"Наличие более дешевой цены на сайте снижает вероятность бронирования в канале, но не гарантирует прямую конверсию.","close":"Давайте проверим гипотезу по данным и протестируем сопоставимые цены на части дат?","fallback":"Сравнить переходы на сайт и фактические потери бронирований в OTA.","avoid":"Не заявлять, что гости никогда не переходят на сайт."},{"quote":"«Пользователи программы лояльности и так видят скидку»","intent":"Отель считает, что персональная скидка компенсирует высокую публичную цену.","diagnose":"Эту скидку видят все пользователи или только определенный уровень участников программы?","join":"Да, программа лояльности усиливает предложение для части аудитории.","bridge":"Но она не заменяет конкурентную публичную цену на всех этапах поиска.","argument":"Если базовый тариф выше рынка, пользователь может не пройти ценовой фильтр и не увидеть объект вообще. Кроме того, персональные механики доступны не всем. Конкурентная публичная цена создает широкий вход в выдачу, а лояльность уже дополнительно усиливает предложение.","proof":"Сначала объект должен попасть в выборку пользователя, и только потом дополнительные скидки влияют на решение.","close":"Готовы разделить задачи: базовую цену сделать конкурентной, а программу лояльности оставить дополнительным преимуществом?","fallback":"Проверить мониторинг, если скидка фактически есть, но некорректно учитывается.","avoid":"Не обесценивать программу лояльности."},{"quote":"«Не хотим платить комиссию за продажу завтрака»","intent":"Клиент оценивает питание отдельно от общей конверсии и среднего чека.","diagnose":"Насколько часто гости выбирают у вас тариф с завтраком и влияет ли он на средний чек бронирования?","join":"Понимаю желание сохранить полную маржинальность дополнительной услуги.","bridge":"При этом для гостя завтрак часто является частью основного выбора отеля, а не отдельной покупкой.","argument":"Если у конкурентов доступен тариф с питанием, а у вас его нет в канале, объект может проиграть сравнение целиком. Тариф с завтраком повышает воспринимаемую ценность, может увеличивать средний чек и особенно важен для семей, командировочных и коротких поездок. Стоит оценить не комиссию с завтрака отдельно, а общий доход от брони, которая могла бы не состояться.","proof":"Фильтр и сравнение по питанию влияют на выбор еще до открытия карточки объекта.","close":"Давайте протестируем тариф с завтраком на ограниченном периоде и сравним конверсию и средний чек?","fallback":"Одновременно выгружать room only и breakfast included.","avoid":"Не давить формулировкой «вы обязаны продавать завтрак»."},{"quote":"«У нас технически не получается выгрузить тарифы»","intent":"Причина может быть в PMS, channel manager, экстранете, интеграции или настройках.","diagnose":"Какие тарифы или категории не выгружаются, на какие даты и через какой channel manager идет подключение?","join":"Понимаю, техническое ограничение нельзя решить коммерческой аргументацией.","bridge":"Сначала локализуем проблему и соберем достаточные данные для поддержки.","argument":"Нужно определить сторону ошибки: PMS, channel manager, экстранет, интеграция или продукт. Для диагностики фиксируем объект, даты, категории, тарифы, тип питания, скриншоты, ожидаемое и фактическое поведение. После этого передаем кейс в поддержку, а если проблема продуктовая — в продуктовую команду.","proof":"Конкретный пример с датой и тарифом позволяет быстрее воспроизвести и исправить ошибку.","close":"Можете прислать один конкретный пример и скриншот настроек, чтобы мы сразу передали его в работу?","fallback":"Зафиксировать ответственного и срок обратной связи по тикету.","avoid":"Не говорить клиенту, что он просто неправильно настроил систему, пока причина не подтверждена."},{"quote":"«Разница небольшая — всего несколько процентов»","intent":"Клиент оценивает среднее отклонение, а не конкретные пользовательские сценарии.","diagnose":"На скольких датах и тарифах возникает эта разница и выводит ли она объект за популярные ценовые диапазоны?","join":"Согласна, небольшой средний процент сам по себе может выглядеть некритично.","bridge":"Но пользователь принимает решение по конкретной дате и конкретной цене, а не по среднему показателю.","argument":"Даже небольшой разрыв может снизить конверсию, если рядом есть сопоставимый объект дешевле, или исключить отель из фильтра с жесткой границей бюджета. Частые частичные проигрыши также делают предложение нестабильным и снижают доверие.","proof":"Для анализа важны не только средний процент, но и количество дат и сценариев, где предложение выглядит хуже.","close":"Давайте посмотрим конкретные проигрышные даты и исправим прежде всего те, где влияние на выдачу максимальное?","fallback":"Сравнить конверсию и бронирования на конкурентных и неконкурентных датах.","avoid":"Не преувеличивать влияние без данных."}]}};let project=Object.keys(DB)[0],selected=0;const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function renderProjects(){projects.innerHTML=Object.entries(DB).map(([k,p])=>`<button class="pbtn ${k===project?'active':''}" data-p="${k}">${p.icon} ${p.name}</button>`).join('');projects.querySelectorAll('button').forEach(b=>b.onclick=()=>{project=b.dataset.p;selected=0;search.value='';render()})}function renderHero(){const p=DB[project];hero.style.setProperty('--project',p.color);hero.innerHTML=`<div><div class="kicker">Проект</div><h2>${esc(p.name)}</h2><p>${esc(p.pitch)}</p><div class="facts">${p.facts.map(x=>`<span class="fact">${esc(x)}</span>`).join('')}</div></div><div class="projectIcon" style="background:${p.color}22;color:${p.color}">${p.icon}</div>`}function filtered(){const q=search.value.trim().toLowerCase();return DB[project].scenarios.map((x,i)=>({...x,_i:i})).filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q))}function renderList(){const a=filtered();count.textContent=`Сценариев: ${a.length}`;list.innerHTML=a.map(x=>`<button class="item ${x._i===selected?'active':''}" data-i="${x._i}">${esc(x.quote)}</button>`).join('')||'<div style="color:#aaa;padding:10px">Ничего не найдено</div>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;renderList();renderContent()})}function speech(x){return `${x.join} ${x.bridge} ${x.argument} ${x.close}`};function renderContent(){const p=DB[project],x=p.scenarios[selected];if(!x){content.className='empty';content.innerHTML='<div>Выберите сценарий</div>';return}content.className='card';content.style.setProperty('--project',p.color);content.innerHTML=`<h2 class="quote">${esc(x.quote)}</h2><div class="intent"><b>Что стоит за возражением:</b> ${esc(x.intent)}</div><div class="flow"><span>1. Диагностика</span><span>2. Присоединение</span><span>3. Аргумент</span><span>4. Закрытие</span></div>${x.quick?`<div class="block wide" style="background:#f7f4ff;border-color:#ded5ff;margin-bottom:13px"><h3>⚡ Лаконичные формулировки</h3><div style="display:grid;gap:8px">${x.quick.map(q=>`<button class="quickPhrase" type="button" style="text-align:left;border:1px solid #ded5ff;background:white;border-radius:12px;padding:11px 12px;cursor:pointer">${esc(q)}</button>`).join('')}</div><p style="margin-top:9px;color:#777;font-size:12px">Нажмите на фразу, чтобы скопировать ее.</p></div>`:''}<div class="grid"><div class="block diagnose wide"><h3>🔎 Сначала уточнить</h3><p>${esc(x.diagnose)}</p></div><div class="block join"><h3>🤝 Присоединение</h3><p>${esc(x.join)}</p></div><div class="block"><h3>→ Переход к аргументации</h3><p>${esc(x.bridge)}</p></div><div class="block argument wide"><h3>💎 Основная аргументация</h3><p>${esc(x.argument)}</p></div><div class="block"><h3>📌 Опора на факты</h3><p>${esc(x.proof)}</p></div><div class="block close"><h3>🎯 Закрывающий вопрос</h3><p>${esc(x.close)}</p></div><div class="block fallback"><h3>🔥 Если клиент пока не согласен</h3><p>${esc(x.fallback)}</p></div><div class="block avoid"><h3>⛔ Чего избегать</h3><p>${esc(x.avoid)}</p></div><div class="block speech wide"><h3>Готовая речь менеджера</h3><p id="speech">${esc(speech(x))}</p><div class="actions"><button id="copy" class="copy">Скопировать готовый ответ</button><button id="next" class="next">Следующая фраза →</button></div></div></div>`;content.querySelectorAll('.quickPhrase').forEach(btn=>btn.addEventListener('click',async()=>{const original=btn.textContent;try{await navigator.clipboard.writeText(original)}catch(e){const t=document.createElement('textarea');t.value=original;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}btn.textContent='Скопировано';setTimeout(()=>btn.textContent=original,1000)}));copy.onclick=async()=>{try{await navigator.clipboard.writeText(speech(x))}catch(e){const t=document.createElement('textarea');t.value=speech(x);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}copy.textContent='Скопировано';copy.classList.add('done');setTimeout(()=>{copy.textContent='Скопировать готовый ответ';copy.classList.remove('done')},1400)};next.onclick=()=>{selected=(selected+1)%p.scenarios.length;renderList();renderContent();window.scrollTo({top:0,behavior:'smooth'})}}function render(){renderProjects();renderHero();renderList();renderContent()}search.oninput=()=>{renderList();const a=filtered();if(a.length&& !a.some(x=>x._i===selected)){selected=a[0]._i;renderList();renderContent()}};render();</script></body></html>
